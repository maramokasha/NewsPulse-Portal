services:
  web:
    build: .
    image: newspulse-portal
    container_name: newspulse-web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-newspulse}
      DB_PASS: ${DB_PASS:-newspulse_pass}
      DB_NAME: ${DB_NAME:-news_system}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/var/www/html/uploads
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: newspulse-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_pass}
      MYSQL_DATABASE: ${DB_NAME:-news_system}
      MYSQL_USER: ${DB_USER:-newspulse}
      MYSQL_PASSWORD: ${DB_PASS:-newspulse_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  uploads_data:
  db_data:
